{% load static %}
<div class="mb-auth-medallion">
    <div class="mb-auth-medallion__glow"></div>
    <svg class="mb-auth-medallion__ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="mb-auth-medallion__ringtrack" cx="50" cy="50" r="47" fill="none" stroke="currentColor"></circle>
        <g class="mb-auth-medallion__arcs" fill="none" stroke="currentColor" stroke-linecap="round">
            <circle cx="50" cy="50" r="47" pathLength="100" stroke-dasharray="16 84"></circle>
            <circle cx="50" cy="50" r="47" pathLength="100" stroke-dasharray="16 84" transform="rotate(180 50 50)"></circle>
        </g>
    </svg>
    <div class="mb-auth-medallion__frame">
        <img src="{% static 'img/logo.png' %}" alt="MyBox">
    </div>
</div>
