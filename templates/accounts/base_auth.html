{% extends 'base.html' %}
{% block content %}
<div class="mb-auth-wrap">
    <div class="mb-auth-orb mb-auth-orb--a"></div>
    <div class="mb-auth-orb mb-auth-orb--b"></div>
    <div class="row justify-content-center position-relative">
        <div class="col-md-6">
            <div class="mb-card mb-auth-card">
                <div class="text-center mb-4">
                    {% block auth_medallion %}{% include 'accounts/_medallion.html' %}{% endblock %}
                    <h4 class="mt-1 mb-0">{% block auth_title %}{% endblock %}</h4>
                    {% block auth_subtitle %}{% endblock %}
                </div>
                {% block auth_body %}{% endblock %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
